name: CI & Deployment to VPS

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test-and-build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Code Check
        run: npm run check

      - name: Run Tests
        run: npm test

      - name: Build SEO Pages & Sitemap
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          retention-days: 1
          path: |
            .
            !.git
            !node_modules
            !tests

  deploy:
    name: Deploy to VPS (/var/www/youtube.fastsitecheck.com)
    needs: test-and-build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: site-build

      - name: Deploy to VPS via SSH & Rsync
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USERNAME }}
          TARGET: "/var/www/youtube.fastsitecheck.com"
          EXCLUDE: "/node_modules/, /.git/, /.github/"
          SCRIPT_AFTER: |
            chown -R www-data:www-data /var/www/youtube.fastsitecheck.com
            chmod -R 755 /var/www/youtube.fastsitecheck.com
            systemctl reload nginx
